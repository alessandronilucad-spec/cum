<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños · 21 Años</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cumple.css">
</head>
<body>
 
  <!-- Fondo decorativo (todo el estilo vive en cumple.css) -->
  <div class="bg-sparkles" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Globos flotantes -->
  <div class="balloon balloon-1" aria-hidden="true"></div>
  <div class="balloon balloon-2" aria-hidden="true"></div>
  <div class="balloon balloon-3" aria-hidden="true"></div>
  <div class="balloon balloon-4" aria-hidden="true"></div>
  <div class="balloon balloon-5" aria-hidden="true"></div>
  <div class="balloon balloon-6" aria-hidden="true"></div>
  <div class="balloon balloon-7" aria-hidden="true"></div>
  <div class="balloon balloon-8" aria-hidden="true"></div>

  <!-- Audio de fondo para cada sección -->
  <audio id="musicaInicio" src="musica/inicio.mp3" loop></audio>
  <audio id="musicaFotos" src="musica/fotos.mp3" loop></audio>
  <audio id="musicaRegalos" src="musica/regalos.mp3" loop></audio>

  <!-- ===================== PANTALLA PRINCIPAL ===================== -->
  <section id="home" class="panel panel-home">
    <p class="eyebrow">✨ Se festeja ✨</p>
    <h1 class="title">Mis 21 años<span class="title-sub">Cami</span></h1>
    <p class="subtitle">Una celebración especial</p>
    <p class="subtitle-small">¡Feliz cumpleaños!</p>
 
    <div class="menu-buttons">
      <button id="btnFotos" class="btn btn-photos" type="button">
        <span class="btn-icon">📷</span> Fotos
      </button>
      <button id="btnRegalo" class="btn btn-gift" type="button">
        <span class="btn-icon">🎁</span> Regalo
      </button>
    </div>
  </section>
 
  <!-- ===================== SECCIÓN FOTOS ===================== -->
  <section id="fotosSection" class="panel panel-section hidden">
    <button class="back-btn" data-target="home" type="button">← Volver</button>
    <h2 class="section-title">Fotos 📷</h2>
    <p class="section-hint">Recuerdos especiales</p>
 
    <div class="gallery">
 
      <!-- FOTOS: reemplazá el src="" por tus imágenes reales -->
      <figure class="card photo-card">
        <img src="fotos/foto1.jpg" alt="Foto 1">
        <figcaption>Escribí un pie de foto</figcaption>
      </figure>
 
      <figure class="card photo-card">
        <img src="fotos/foto2.jpg" alt="Foto 2">
        <figcaption>Escribí un pie de foto</figcaption>
      </figure>
 
      <figure class="card photo-card">
        <img src="fotos/foto3.jpg" alt="Foto 3">
        <figcaption>Escribí un pie de foto</figcaption>
      </figure>
 
      <figure class="card photo-card">
        <img src="fotos/foto4.jpg" alt="Foto 4">
        <figcaption>Escribí un pie de foto</figcaption>
      </figure>

      <figure class="card photo-card">
        <img src="fotos/foto5.jpg" alt="Foto 5">
        <figcaption>Escribí un pie de foto</figcaption>
      </figure>

      <figure class="card photo-card">
        <img src="fotos/foto6.jpg" alt="Foto 6">
        <figcaption>Escribí un pie de foto</figcaption>
      </figure>

    </div>
  </section>
 
  <!-- ===================== SECCIÓN REGALO (CAJAS) ===================== -->
  <section id="regaloSection" class="panel panel-section hidden">
    <button class="back-btn" data-target="home" type="button">← Volver</button>
    <h2 class="section-title">Abrí tus regalos 🎁</h2>
    <p class="section-hint">Hacé click en cada caja para descubrir tu carta especial</p>

    <div id="boxesGrid" class="boxes-grid"></div>
  </section>
 
  <script>
    // ---------- Navegación entre secciones ----------
    const panels = {
      home: document.getElementById('home'),
      fotosSection: document.getElementById('fotosSection'),
      regaloSection: document.getElementById('regaloSection'),
    };
 
    // Referencias a los audios
    const musicaInicio = document.getElementById('musicaInicio');
    const musicaFotos = document.getElementById('musicaFotos');
    const musicaRegalos = document.getElementById('musicaRegalos');

    function stopAllMusic() {
      musicaInicio.pause();
      musicaFotos.pause();
      musicaRegalos.pause();
      musicaInicio.currentTime = 0;
      musicaFotos.currentTime = 0;
      musicaRegalos.currentTime = 0;
    }

    function showPanel(name) {
      Object.values(panels).forEach(p => p.classList.add('hidden'));
      panels[name].classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Detener todas las músicas
      stopAllMusic();

      // Reproducir música según la sección
      if (name === 'home') {
        musicaInicio.play().catch(err => console.log('No se pudo reproducir la música:', err));
      } else if (name === 'fotosSection') {
        musicaFotos.play().catch(err => console.log('No se pudo reproducir la música:', err));
      } else if (name === 'regaloSection') {
        musicaRegalos.play().catch(err => console.log('No se pudo reproducir la música:', err));
      }
    }

    // Reproducir música de inicio al cargar la página
    window.addEventListener('load', () => {
      musicaInicio.play().catch(err => {
        console.log('La música se reproducirá después de la primera interacción del usuario');
      });
    });
 
    document.getElementById('btnFotos').addEventListener('click', () => showPanel('fotosSection'));
    document.getElementById('btnRegalo').addEventListener('click', () => showPanel('regaloSection'));
 
    document.querySelectorAll('.back-btn').forEach(btn => {
      btn.addEventListener('click', () => showPanel(btn.dataset.target));
    });

    // ---------- Regalo: cajas de regalo ----------
    const boxesGrid = document.getElementById('boxesGrid');
    const NUMERO_DE_CAJAS = 7; // Cambia este número para tener más o menos cajas

    // Funciones para guardar y cargar el estado de las cajas
    function guardarEstadoCajas(estadoCajas) {
      localStorage.setItem('cajasAbiertas', JSON.stringify(estadoCajas));
    }

    function cargarEstadoCajas() {
      const guardado = localStorage.getItem('cajasAbiertas');
      return guardado ? JSON.parse(guardado) : {};
    }

    let estadoCajas = cargarEstadoCajas();
 
    // Cartas que aparecen al abrir una caja — editá / agregá las que quieras
    const cartas = [
      {
        frente: "💌 Lucio ",
        detras: "Prima/Cuña: Feliz cumpleaños!Pasala lindo con tus amigos y familia,que los deseos y sueños que tienes secumplan y logres las metas que te propongas. Tu ser contagia alegria y muchos bifes (👊🏻😂),agradezco el haberte conocido. Que tu sois heureuxavec le mani de mon cousin JAJAJA.P/D: En la pera toda la noche P/D 2: Si no sabés frances, usá el traductor. "
      },
      {
        frente: "💌 Viki ",
        detras: "21 años y contando... ¡lo mejor recién empieza! Que este año esté lleno de risas, amor y momentos inolvidables. 🥂"
      },
      {
        frente: "💌 Janet ",
        detras: "Gracias por existir y llenar de luz cada día. Ojalá tengas un cumpleaños tan especial como vos. 💛"
      },
      {
        frente: "💌 Rambo ",
        detras: "Que se cumplan todos tus deseos este año. Sos una persona maravillosa y el mundo es mejor contigo en él. ✨"
      },
      {
        frente: "💌 Rocha ",
        detras: "Hola Cami quería desearte muy feliz cumple que todos tus deseos se cumplan 🥰😍Quería decirte gracias por tu amistad  incondicional Siempre que necesites algo podes contar conmigo para lo que sea ya lo sabes 🥰✨ con vos siempre vuelvo a ser una niña y es lo más lindo que sacas de mi 💗"
      },
      {
        frente: "💌 Anto ",
        detras: "Brindo por vos y por todo lo que viene. Que la vida te siga sorprendiendo con cosas hermosas. 🍾"
      },
      {
        frente: "💌 Lucas ",
        detras: "Amor, feliz 21 añitos. En este gran día para vos, te quiero desear que lo pases de la mejor manera y que lo disfrutes. Sé que para vos este día es uno más y que no es el mejor del mundo, pero vos te mereces ser feliz; la vida ya se merece hacerte feliz. Sos lo mejor que este mundo tiene, con tu bonita sonrisa, tus cortes de pelo y tu manera de hacer las cosas —aunque te duelan después, pero eso es lo que te hace feliz— y el no rendirte. No voy a arruinar esta carta con agradecerte por estar a mi lado y por estar al lado de mi familia. Con amor y cariño, te amo mucho, bb."
      }
    ];

    function createBox(index) {
      const box = document.createElement('button');
      box.type = 'button';
      box.className = 'gift-box';
      box.setAttribute('aria-label', 'Abrir regalo ' + (index + 1));
      box.dataset.index = index;

      box.innerHTML = `
        <span class="box-lid"></span>
        <span class="box-ribbon-v"></span>
        <span class="box-ribbon-h"></span>
        <span class="box-base"></span>
        <div class="box-carta">
          <div class="carta-inner">
            <div class="carta-face carta-front"></div>
            <div class="carta-face carta-back"></div>
          </div>
        </div>
      `;

      const cartaElement = box.querySelector('.box-carta');
      const cartaFront = box.querySelector('.carta-front');
      const cartaBack = box.querySelector('.carta-back');

      // Restaurar estado si ya fue abierta antes
      if (estadoCajas[index]) {
        box.classList.add('open');
        cartaFront.textContent = estadoCajas[index].frente;
        cartaBack.textContent = estadoCajas[index].detras;

        if (estadoCajas[index].flipped) {
          cartaElement.classList.add('flipped');
        }
      }

      // Evento de click en la caja para abrir/cerrar
      box.addEventListener('click', () => {
        if (box.classList.contains('open')) {
          // Si ya está abierta, cerrarla
          box.classList.remove('open');
          cartaElement.classList.remove('flipped');
          cartaFront.textContent = '';
          cartaBack.textContent = '';

          // Eliminar del estado guardado
          delete estadoCajas[index];
          guardarEstadoCajas(estadoCajas);
        } else {
          // Si está cerrada, abrirla
          box.classList.add('open');

          const carta = cartas[index];
          cartaFront.textContent = carta.frente;
          cartaBack.textContent = carta.detras;

          // Guardar estado de la caja abierta
          estadoCajas[index] = {
            frente: carta.frente,
            detras: carta.detras,
            flipped: false
          };
          guardarEstadoCajas(estadoCajas);
        }
      });

      // Al hacer click en la carta, se da vuelta (solo si está abierta)
      cartaElement.addEventListener('click', (e) => {
        if (!box.classList.contains('open')) return;

        e.stopPropagation();
        cartaElement.classList.toggle('flipped');

        // Guardar estado de volteado
        if (estadoCajas[index]) {
          estadoCajas[index].flipped = cartaElement.classList.contains('flipped');
          guardarEstadoCajas(estadoCajas);
        }
      });

      return box;
    }
 
    function generateBoxes() {
      boxesGrid.innerHTML = '';
      for (let i = 0; i < NUMERO_DE_CAJAS; i++) {
        boxesGrid.appendChild(createBox(i));
      }
    }

    // Generar cajas al cargar la página
    generateBoxes();
  </script>
</body>
</html>
